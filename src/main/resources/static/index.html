<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Placement Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <p class="eyebrow">// placement control room</p>
    <h1>Application Tracker</h1>
    <p class="sub">Every company, every deadline, every prep note — one board. Backed by Spring Boot.</p>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input class="search" id="search" placeholder="Search by company or role..." />
      <button class="btn-primary" id="addBtn">+ Add application</button>
    </div>

    <div id="boardWrap">
      <div class="loading">Loading your board...</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">Add application</h2>
      <div class="field">
        <label>Company</label>
        <input id="f-company" placeholder="e.g. Atlassian" />
      </div>
      <div class="field">
        <label>Role</label>
        <input id="f-role" placeholder="e.g. SDE Intern" />
      </div>
      <div class="row2">
        <div class="field">
          <label>Stage</label>
          <select id="f-stage"></select>
        </div>
        <div class="field">
          <label>Deadline / next date</label>
          <input id="f-deadline" type="date" />
        </div>
      </div>
      <div class="field">
        <label>Application link (optional)</label>
        <input id="f-link" placeholder="https://..." />
      </div>
      <div class="field">
        <label>Notes / interview prep</label>
        <textarea id="f-notes" placeholder="Topics to revise, recruiter contacts, rounds so far..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
